name: Queue maintenance

on:
  push:
    branches: [release/v0.2]
  pull_request:
    branches: [release/v0.2]

permissions:
  contents: read

jobs:
  minimum-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.4'
      - name: Test root module at its minimum Go version
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: go test -race ./...

  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
      - name: Test every module
        env:
          FULL: '1'
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: bash scripts/test-all-modules.sh
      - name: Check README examples
        run: bash scripts/check-readme-snippets.sh

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [null, sync, workerpool, redis, mysql, postgres, sqlite, nats, sqs, rabbitmq]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
      - name: Test broker contracts
        working-directory: integration
        env:
          INTEGRATION_BACKEND: ${{ matrix.backend }}
          GOWORK: 'off'
          GOTOOLCHAIN: local
        run: go test -race -p=1 -tags integration ./...
